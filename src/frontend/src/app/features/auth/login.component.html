<div class="page-container">

  <div class="card">

    <h2>Logowanie</h2>

    <form [formGroup]="form">

      <div class="form-group">
        <label>Email</label>
        <input
          type="email"
          formControlName="email">
      </div>

      <div class="form-group">
        <label>Hasło</label>
        <input
          type="password"
          formControlName="password">
      </div>

      <button
        type="button"
        (click)="login()">
        Zaloguj
      </button>

    </form>

  </div>

</div>
